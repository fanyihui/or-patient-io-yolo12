# 手术室入/出室检测 v1 — 双模型融合 + 伪床推断（无需训练）
# 场景：带栏杆病床推进；患者盖被，通常只露出头部
#
# 推床在 COCO / 开放词汇里经常漏检。默认策略：
# 1) YOLO-World 主检（hospital bed / stretcher / human head …）
# 2) YOLO12 COCO 辅检（bed/couch/dining table/person）
# 3) 仍无床时：用盖被头框扩成伪床（pseudo_bed）再与头配对
# 4) 按整体尺寸区分病床推车（大）与器械推车（小）

model:
  # fusion = world + coco（推荐）；world / yoloe / coco 也可
  backend: fusion
  primary_backend: world
  weights: yolov8s-worldv2.pt
  secondary_weights: yolo12n.pt
  secondary_conf: 0.08
  conf: 0.08
  iou: 0.5
  imgsz: 960
  # auto=有 CUDA 用 GPU(0)，否则 CPU；也可写 0 / cpu / 0,1
  device: auto
  prompts:
    - person
    - human head
    - face
    - patient
    - hospital bed
    - stretcher
    - gurney
    - medical bed
    - hospital stretcher
    - wheeled bed
    - bed with rails
    - bed
    - mattress
    - instrument cart
    - equipment cart
    - medical cart
    - utility cart
    - mayo stand
  bed_prompts:
    - hospital bed
    - stretcher
    - gurney
    - medical bed
    - hospital stretcher
    - wheeled bed
    - bed with rails
    - bed
    - mattress
  equipment_prompts:
    - instrument cart
    - equipment cart
    - medical cart
    - utility cart
    - mayo stand
  person_prompts: [person, human head, face, patient]
  classes: [0, 56, 57, 59, 60]

tracker:
  config: configs/bytetrack.yaml

target:
  mode: bed_patient
  stretcher:
    accept_bed_class: true
    bed_class_ids: [59]
    extra_bed_like_ids: [56, 57, 60]
    # 病床推车尺寸门槛（器械推车更小/更方，达不到）
    bed_min_aspect_wh: 1.15
    bed_min_area_ratio: 0.045
    bed_min_width_ratio: 0.18
    bed_min_height_ratio: 0.06
    furniture_bed_min_area_ratio: 0.065
    furniture_bed_min_aspect_wh: 1.30
    reject_small_bed_as_equipment: true
    equipment_max_area_ratio: 0.055
    equipment_relative_area_max: 0.72
    # 无躺着患者头的中小型床状目标降为器械车
    demote_bed_without_patient: true
    empty_stretcher_min_area_ratio: 0.08
    empty_stretcher_min_aspect_wh: 1.45

    patient_appearance: covered_head
    max_patient_to_bed_area: 0.75
    head_max_area_ratio: 0.25
    head_min_area_ratio: 0.0006
    head_in_bed_margin: 0.28
    # 只认躺着的头：排除直立人体上半身的头/脸
    reject_upright_heads: true
    standing_head_upper_ratio: 0.55
    lying_head_min_aspect_wh: 0.65
    staff_max_aspect_wh: 0.90
    # 推器械车时人体框变宽，仍按直立医护（须够高）
    staff_push_max_aspect_wh: 1.35
    staff_min_height_ratio: 0.22

    # 推床类漏检时：用头部扩伪床
    allow_pseudo_bed: true
    pseudo_bed_require_staff: false
    pseudo_bed_staff_dist_ratio: 0.32
    pseudo_bed_width_scale: 4.8
    pseudo_bed_height_scale: 2.6

    # 躺姿：须足够横向且不够高；避免推车医护被标成躺着的患者
    lying_aspect_wh: 1.45
    lying_area_ratio: 0.02
    lying_max_height_ratio: 0.28
    reject_lying_near_equipment: true
    lying_equipment_iou_min: 0.08
    lying_equipment_center_dist_ratio: 0.12
    min_hits: 2
    min_pair_iou: 0.01
    max_center_dist_ratio: 0.32
    allow_center_in_bed: true
    pair_grace_frames: 20
    allow_merged_detection: true
    merged_min_aspect_wh: 1.55
    merged_min_area_ratio: 0.04

# Camera 01：门在画面上方偏右
zone:
  mode: roi
  rois:
    outside:
      polygon:
        - [0.52, 0.07]
        - [0.70, 0.07]
        - [0.71, 0.25]
        - [0.52, 0.26]
    inside:
      polygon:
        - [0.42, 0.27]
        - [0.72, 0.25]
        - [0.76, 0.46]
        - [0.38, 0.48]

door_line:
  p1: [0.50, 0.15]
  p2: [0.50, 0.90]
  outside_side: left

events:
  debounce_frames: 15
  min_crossing_disp: 0.0

# 实时流（RTSP/HTTP/摄像头）—— scripts/run_stream.py
stream:
  reconnect: true
  reconnect_delay_sec: 2.0
  max_reconnect_attempts: 0   # 0=无限重连
  buffer_size: 1              # 低延迟
  open_timeout_ms: 8000
  read_timeout_ms: 5000
  drop_pending: true          # 处理跟不上时丢旧帧保实时
  max_pending_grabs: 8
  target_fps: 10              # 处理帧率上限；0=尽量每帧
  status_every_sec: 10
  ffmpeg_options: "rtsp_transport;tcp|fflags;nobuffer|flags;low_delay"

output:
  save_video: true
  # 实时流时可按时长切段（分钟）；0=单文件 annotated.mp4
  video_segment_minutes: 30
  save_events_json: true
  # 实时追加（流模式默认开启）
  save_events_jsonl: true
  save_events_csv: true
  events_flush_every: 1
  draw_tracks: true
  draw_zone: true
  draw_door_line: true
  # 屏蔽直立医护/行人标注（默认开启；床/头/躺姿仍会画）
  hide_standing_staff: true
  # 屏蔽器械推车（默认开启；不参与入出室）
  hide_equipment_carts: true
  # 可选白名单，例如: [bed, patient_head, lying_patient]
  # draw_roles: [bed, patient_head, lying_patient]
