# 手术室入/出室检测 v1 — YOLO12 + ByteTrack（无需训练）
# 场景：带栏杆病床推进；患者盖被，通常只露出头部

model:
  weights: yolo12n.pt
  conf: 0.20
  iou: 0.5
  imgsz: 640
  # auto=有 CUDA 用 GPU(0)，否则 CPU；也可写 0 / cpu / 0,1
  device: auto
  classes: [0, 57, 59]   # person, couch, bed

tracker:
  config: configs/bytetrack.yaml

target:
  # bed_patient = 病床 + 床上患者证据（推荐）
  mode: bed_patient
  stretcher:
    accept_bed_class: true
    bed_class_ids: [59]           # COCO bed（含栏杆病床多数仍落此类）
    extra_bed_like_ids: [57]      # couch 弱兜底
    bed_min_aspect_wh: 1.05       # 推床通常横向
    bed_min_area_ratio: 0.03

    # covered_head = 盖被只露头（默认真实场景）
    # lying_full   = 可见全身横向
    # any          = 两种都接受
    patient_appearance: covered_head
    max_patient_to_bed_area: 0.55 # 患者框/床框面积上限，排除床旁高大医护
    staff_max_aspect_wh: 0.85
    staff_min_height_ratio: 0.28

    # 兼容全身可见 / 合成视频
    lying_aspect_wh: 1.20
    lying_area_ratio: 0.02
    min_hits: 2
    min_pair_iou: 0.01
    max_center_dist_ratio: 0.20
    allow_center_in_bed: true
    pair_grace_frames: 12         # 头短暂被遮挡时保持配对
    allow_merged_detection: true
    merged_min_aspect_wh: 1.5
    merged_min_area_ratio: 0.05

# Camera 01：门在画面上方偏右（门外=走廊，内侧=术间）
# 预览图：docs/or_door_roi_preview.png ；精细标定用 scripts/calibrate_zones.py
zone:
  mode: roi
  rois:
    outside:   # 门外走廊（门洞内，偏左靠后）
      polygon:
        - [0.52, 0.07]
        - [0.70, 0.07]
        - [0.71, 0.25]
        - [0.52, 0.26]
    inside:    # 术间内侧（门槛朝房间一侧，偏左靠上）
      polygon:
        - [0.42, 0.27]
        - [0.72, 0.25]
        - [0.76, 0.46]
        - [0.38, 0.48]

door_line:
  p1: [0.50, 0.15]
  p2: [0.50, 0.90]
  outside_side: left

events:
  debounce_frames: 15
  min_crossing_disp: 0.0

output:
  save_video: true
  save_events_json: true
  draw_tracks: true
  draw_zone: true
  draw_door_line: true
