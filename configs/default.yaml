# 手术室入/出室检测 v1 — 双模型融合 + 伪床推断（无需训练）
# 场景：带栏杆病床推进；患者盖被，通常只露出头部
#
# 推床在 COCO / 开放词汇里经常漏检。默认策略：
# 1) YOLO-World 主检（hospital bed / stretcher / human head …）
# 2) YOLO12 COCO 辅检（bed/couch/dining table/person）
# 3) 仍无床时：用盖被头框扩成伪床（pseudo_bed）再与头配对

model:
  # fusion = world + coco（推荐）；world / yoloe / coco 也可
  backend: fusion
  primary_backend: world
  weights: yolov8s-worldv2.pt
  secondary_weights: yolo12n.pt
  secondary_conf: 0.08
  conf: 0.08
  iou: 0.5
  imgsz: 960
  # auto=有 CUDA 用 GPU(0)，否则 CPU；也可写 0 / cpu / 0,1
  device: auto
  prompts:
    - person
    - human head
    - face
    - patient
    - hospital bed
    - stretcher
    - gurney
    - medical bed
    - hospital stretcher
    - patient trolley
    - hospital trolley
    - wheeled bed
    - bed with rails
    - bed
    - mattress
  bed_prompts:
    - hospital bed
    - stretcher
    - gurney
    - medical bed
    - hospital stretcher
    - patient trolley
    - hospital trolley
    - wheeled bed
    - bed with rails
    - bed
    - mattress
  person_prompts: [person, human head, face, patient]
  classes: [0, 56, 57, 59, 60]

tracker:
  config: configs/bytetrack.yaml

target:
  mode: bed_patient
  stretcher:
    accept_bed_class: true
    bed_class_ids: [59]
    extra_bed_like_ids: [56, 57, 60]
    bed_min_aspect_wh: 0.75
    bed_min_area_ratio: 0.008

    patient_appearance: covered_head
    max_patient_to_bed_area: 0.75
    head_max_area_ratio: 0.25
    head_in_bed_margin: 0.28
    staff_max_aspect_wh: 0.90
    staff_min_height_ratio: 0.22

    # 推床类漏检时：用头部扩伪床
    allow_pseudo_bed: true
    pseudo_bed_require_staff: false
    pseudo_bed_staff_dist_ratio: 0.32
    pseudo_bed_width_scale: 4.8
    pseudo_bed_height_scale: 2.6

    lying_aspect_wh: 1.05
    lying_area_ratio: 0.012
    min_hits: 2
    min_pair_iou: 0.01
    max_center_dist_ratio: 0.32
    allow_center_in_bed: true
    pair_grace_frames: 20
    allow_merged_detection: true
    merged_min_aspect_wh: 1.15
    merged_min_area_ratio: 0.025

# Camera 01：门在画面上方偏右
zone:
  mode: roi
  rois:
    outside:
      polygon:
        - [0.52, 0.07]
        - [0.70, 0.07]
        - [0.71, 0.25]
        - [0.52, 0.26]
    inside:
      polygon:
        - [0.42, 0.27]
        - [0.72, 0.25]
        - [0.76, 0.46]
        - [0.38, 0.48]

door_line:
  p1: [0.50, 0.15]
  p2: [0.50, 0.90]
  outside_side: left

events:
  debounce_frames: 15
  min_crossing_disp: 0.0

output:
  save_video: true
  save_events_json: true
  draw_tracks: true
  draw_zone: true
  draw_door_line: true
  # 屏蔽直立医护/行人标注（默认开启；床/头/躺姿仍会画）
  hide_standing_staff: true
  # 可选白名单，例如: [bed, patient_head, lying_patient]
  # draw_roles: [bed, patient_head, lying_patient]
